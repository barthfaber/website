<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Gallery - Barth Faber</title>
    
    <!-- PRELOAD -->
    <link rel="preload" href="images/gallery/headshots/foto1.webp" as="image">
    <link rel="preload" href="images/gallery/headshots/foto2.webp" as="image">
    <link rel="preload" href="images/gallery/headshots/foto3.webp" as="image">
    <link rel="preload" href="images/gallery/headshots/foto4.webp" as="image">

    <link rel="stylesheet" href="style.css">
    <style>
        /* Specifieke stijlen voor de Galerie-pagina */
        .page-section {
            flex: 1;
            padding: 40px 40px 60px 110px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 50px;
            text-align: center;
        }

        .gallery-category {
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background-color: rgba(20, 19, 18, 0.6);
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .gallery-category:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Klikbare header voor de accordion */
        .category-header {
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            background-color: rgba(15, 14, 14, 0.8);
            transition: background-color 0.3s ease;
        }

        .category-header:hover {
            background-color: rgba(30, 28, 28, 0.9);
        }

        .category-title {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #e74c3c;
            text-transform: uppercase;
            margin: 0;
            white-space: nowrap;
        }

        /* Duidelijke actie-knop rechts met show/hide */
        .category-toggle-btn {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .category-header:hover .category-toggle-btn {
            background-color: #e74c3c;
            border-color: #e74c3c;
        }

        /* Standaard ingeklapt */
        .gallery-grid-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1);
            padding: 0 25px;
        }

        /* Wanneer opengeklapt via de .open klasse */
        .gallery-category.open .gallery-grid-wrapper {
            max-height: 5000px;
            transition: max-height 1s ease-in-out;
            padding: 25px;
        }

        .gallery-category.open .category-toggle-btn {
            background-color: #e74c3c;
            border-color: #e74c3c;
        }

        /* Exact 4 kolommen naast elkaar */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 9 / 16; 
            overflow: hidden;
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font-size: 0.8rem;
            padding: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-caption {
            opacity: 1;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        .gallery-item:hover img {
            filter: brightness(1.08);
            transform: scale(1.02);
        }

        /* LIGHTBOX STIJLEN */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 90%;
            max-height: 85vh;
        }

        .lightbox-content {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            background-color: transparent;
            padding: 0;
            border-radius: 2px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            display: block;
        }

        #lightbox-caption {
            color: #ffffff;
            margin-top: 15px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-align: center;
            min-height: 20px;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            z-index: 1010;
        }

        .lightbox-close:hover {
            color: #e74c3c;
        }

        .lightbox-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 2rem;
            padding: 12px 16px;
            cursor: pointer;
            z-index: 1010;
            border-radius: 3px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
            user-select: none;
        }

        .lightbox-arrow:hover {
            background-color: rgba(231, 76, 60, 0.9);
            border-color: #e74c3c;
            color: #ffffff;
        }

        .lightbox-prev { left: 40px; }
        .lightbox-next { right: 40px; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Dropdown achtergrondkleur exact gelijk aan het hoofdmenu */
        header nav ul li.has-dropdown .dropdown-menu {
            background-color: #111111;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ==========================================
            RESPONSIVE REGELS VOOR MOBIEL & TABLET
           ========================================== */
        @media (max-width: 1000px) {
            header {
                flex-direction: column;
                padding: 12px 15px;
                gap: 8px;
            }

            @media (orientation: portrait) {
                header nav ul {
                    display: flex;
                    flex-wrap: nowrap;
                    justify-content: center;
                    gap: 12px;
                    width: 100%;
                }

                header nav ul li {
                    flex: unset;
                }

                header nav ul li a {
                    font-size: 0.75rem;
                    letter-spacing: 0.2px;
                    white-space: nowrap;
                }
            }

            @media (orientation: landscape) {
                header nav ul {
                    display: flex;
                    flex-wrap: nowrap;
                    justify-content: center;
                    gap: 20px;
                }
            }

            .social-sidebar {
                display: none;
            }

            header nav ul li.has-dropdown {
                position: relative;
            }

            header nav ul li.has-dropdown .dropdown-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 50%;
                transform: translateX(-50%);
                min-width: 140px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.9);
                z-index: 100;
            }

            header nav ul li.has-dropdown.open .dropdown-menu {
                display: block;
            }
        }

        @media (max-width: 1200px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .page-section { padding: 20px 15px 40px 15px; }
            .page-title { font-size: 2rem; margin-bottom: 25px; }
            
            .category-header { padding: 12px 15px; }
            .category-title { font-size: 0.85rem; letter-spacing: 0.5px; }
            .category-toggle-btn { font-size: 0.65rem; padding: 4px 8px; }

            .gallery-grid { grid-template-columns: 1fr; gap: 15px; }
            .lightbox-close { top: 15px; right: 20px; }
            .lightbox-arrow { padding: 8px 12px; font-size: 1.5rem; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="index.html">Barth Faber</a></div>
        <nav>
            <ul>
                <li class="has-dropdown" id="dropdownToggle">
                    <a href="javascript:void(0)" onclick="toggleDropdown(event)">Showreel &#9662;</a>
                    <ul class="dropdown-menu">
                        <li><a href="showreel.html">Acting Reels</a></li>
                        <li><a href="showreel-voice.html">Voice Reels</a></li>
                    </ul>
                </li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="social-sidebar">
        <a href="https://www.youtube.com/@barthfaber3272" target="_blank" rel="noopener noreferrer">Youtube</a>
        <a href="https://www.instagram.com/barthfaber/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.facebook.com/profile.php?id=100090867703374" target="_blank" rel="noopener noreferrer">Facebook</a>
    </div>

    <section class="page-section">
        <h1 class="page-title">Gallery</h1>
        
        <!-- Categorie 1: Headshots -->
        <div class="gallery-category" id="cat-headshots">
            <div class="category-header" onclick="toggleCategory('cat-headshots')">
                <h2 class="category-title">Headshots & Casting</h2>
                <span class="category-toggle-btn" id="btn-headshots">[ + Show ]</span>
            </div>
            <div class="gallery-grid-wrapper">
                <div class="gallery-grid" id="grid-headshots"></div>
            </div>
        </div>

        <!-- Categorie 2: Modeling -->
        <div class="gallery-category" id="cat-modeling">
            <div class="category-header" onclick="toggleCategory('cat-modeling')">
                <h2 class="category-title">Modeling</h2>
                <span class="category-toggle-btn" id="btn-modeling">[ + Show ]</span>
            </div>
            <div class="gallery-grid-wrapper">
                <div class="gallery-grid" id="grid-modeling"></div>
            </div>
        </div>

        <!-- Categorie 3: Film Stills -->
        <div class="gallery-category" id="cat-filmstills">
            <div class="category-header" onclick="toggleCategory('cat-filmstills')">
                <h2 class="category-title">Film Stills</h2>
                <span class="category-toggle-btn" id="btn-filmstills">[ + Show ]</span>
            </div>
            <div class="gallery-grid-wrapper">
                <div class="gallery-grid" id="grid-filmstills"></div>
            </div>
        </div>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightboxOnBg(event)">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-arrow lightbox-prev" onclick="changeSlide(-1); event.stopPropagation();">&#10094;</div>
        
        <div class="lightbox-container">
            <img id="lightbox-img" class="lightbox-content" src="" alt="Vergrote foto" oncontextmenu="return false;" draggable="false">
            <div id="lightbox-caption"></div>
        </div>
        
        <div class="lightbox-arrow lightbox-next" onclick="changeSlide(1); event.stopPropagation();">&#10095;</div>
    </div>

    <footer>
        <p>&copy; 2026 Barth Faber. Alle rechten voorbehouden.</p>
    </footer>

    <script>
        const headshots = [
            { file: "foto1.webp", text: "" },
            { file: "foto2.webp", text: "" },
            { file: "foto3.webp", text: "" },
            { file: "foto4.webp", text: "" },
        ];

        const modeling = [
            { file: "foto.webp", text: "Photographer: Barth Faber" },
            { file: "foto5.webp", text: "Photographer: Barth Faber" },
            { file: "foto9.webp", text: "Photographer: Barth Faber" },
            { file: "PaulinaWesołowska1.webp", text: "Photographer: Paulina Wesołowska" },
            { file: "PaulinaWesołowska2.webp", text: "Photographer: Paulina Wesołowska" },
            { file: "PaulinaWesołowska3.webp", text: "Photographer: Paulina Wesołowska" },
            { file: "PaulinaWesołowska4.webp", text: "Photographer: Paulina Wesołowska" },
            { file: "PaulinaWesołowska5.webp", text: "Photographer: Paulina Wesołowska" },
            { file: "BramvanDal1.webp", text: "Photographer: Bram van Dal" },
            { file: "BramvanDal2.webp", text: "Photographer: Bram van Dal" },
            { file: "BramvanDal3.webp", text: "Photographer: Bram van Dal" },
            { file: "BramvanDal4.webp", text: "Photographer: Bram van Dal" },
            { file: "BramvanDal5.webp", text: "Photographer: Bram van Dal" },
        ];

        const filmStills = [
            { file: "ComplotinNapels2.webp", text: "Complot in Napels (Dir: Jan Melkebeek)" },
            { file: "ComplotinNapels3.webp", text: "Complot in Napels (Dir: Jan Melkebeek)" },
            { file: "Machina.webp", text: "Machina (Dir: Rinor Qerkini)" },
            { file: "GebrokenWit.webp", text: "Gebroken Wit (Dir: Yoran van den Berg)" },
            { file: "GebrokenWit2.webp", text: "Gebroken Wit (Dir: Yoran van den Berg)" },
            { file: "Insusceptible2.webp", text: "Insusceptible (Dir: Keshavi Jaharia)" },
            { file: "Insusceptible3.webp", text: "Insusceptible (Dir: Keshavi Jaharia)" },
            { file: "Excessen.webp", text: "Excessen (Dir: Daan Verhulst)" },
            { file: "HandenvanZilver.webp", text: "Handen van Zilver (Dir: Mathijs Klingeman)" },
            { file: "Abraham.webp", text: "Abraham (Dir: Tobias Kooijman / Roel Mathijssen)" },
            { file: "Abraham2.webp", text: "Abraham (Dir: Tobias Kooijman / Roel Mathijssen)" },
            { file: "Routine.webp", text: "Routine (Dir: Bas van der Steen)" },
            { file: "HetAfscheid.webp", text: "Het Afscheid (Dir: Milan van Helvoort)" },
            { file: "HetAfscheid3.webp", text: "Het Afscheid (Dir: Milan van Helvoort)" },
            { file: "David.webp", text: "David (Dir: Tijn Severin)" },
            { file: "David2.webp", text: "David (Dir: Tijn Severin)" },
            { file: "VaneenAnderPerspectief.webp", text: "Van een Ander Perspectief (Dir: Julian de Bock)" },
            { file: "VaneenAnderPerspectief2.webp", text: "Van een Ander Perspectief (Dir: Julian de Bock)" },
            { file: "GoedHoor.webp", text: "Goed Hoor (Dir: Dylan Geurts)" },
            { file: "HauntingVoice.webp", text: "Haunting Voice (Dir: Madelief Bakker)" },
            { file: "GevallenofGevlogen.webp", text: "Gevallen of Gevlogen (Dir: E. Hoogstrate, T. Kooijman, J. Castelijns)" },
            { file: "OudZeer1.webp", text: "Oud Zeer (Dir: Jeroen Berends)" },
            { file: "OudZeer3.webp", text: "Oud Zeer (Dir: Jeroen Berends)" },
            { file: "OudZeer4.webp", text: "Oud Zeer (Dir: Jeroen Berends)" },
        ];
        
        const headshotsFolder = "images/gallery/headshots/";
        const modelingFolder = "images/gallery/modeling/";
        const stillsFolder = "images/gallery/filmstills/";
        
        const allItems = [
            ...headshots.map(item => ({ path: headshotsFolder + item.file, text: item.text })),
            ...modeling.map(item => ({ path: modelingFolder + item.file, text: item.text })),
            ...filmStills.map(item => ({ path: stillsFolder + item.file, text: item.text }))
        ];

        function renderCategory(containerId, itemsArray, folderPath, startIndex) {
            const container = document.getElementById(containerId);

            itemsArray.forEach((item, index) => {
                const globalIndex = startIndex + index; 
                const fullPath = folderPath + item.file;
                const captionHtml = item.text ? `<div class="gallery-caption">${item.text}</div>` : '';
                
                const loadingAttr = globalIndex < 4 ? 'eager' : 'lazy';
                
                container.innerHTML += `
                    <div class="gallery-item" onclick="openLightbox(${globalIndex})">
                        <img src="${fullPath}" alt="Barth Faber Portfolio" loading="${loadingAttr}" oncontextmenu="return false;" draggable="false">
                        ${captionHtml}
                    </div>
                `;
            });
        }

        renderCategory('grid-headshots', headshots, headshotsFolder, 0);
        renderCategory('grid-modeling', modeling, modelingFolder, headshots.length);
        renderCategory('grid-filmstills', filmStills, stillsFolder, headshots.length + modeling.length);
        
        function toggleCategory(categoryId) {
            const element = document.getElementById(categoryId);
            const isOpen = element.classList.contains('open');
            const btn = element.querySelector('.category-toggle-btn');
            
            element.classList.toggle('open');
            
            if (!isOpen) {
                btn.textContent = '[ - Hide ]';
            } else {
                btn.textContent = '[ + Show ]';
            }
        }

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function closeLightboxOnBg(event) {
            if (event.target.id === 'lightbox') {
                closeLightbox();
            }
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= allItems.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = allItems.length - 1;
            }
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');
            
            lightboxImg.src = allItems[currentIndex].path;
            lightboxCaption.textContent = allItems[currentIndex].text;
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            var dropdown = document.getElementById('dropdownToggle');
            dropdown.classList.toggle('open');
        }

        document.addEventListener('click', function() {
            var dropdown = document.getElementById('dropdownToggle');
            if (dropdown) {
                dropdown.classList.remove('open');
            }
        });

        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (event.key === 'ArrowLeft') changeSlide(-1);
                else if (event.key === 'ArrowRight') changeSlide(1);
                else if (event.key === 'Escape') closeLightbox();
            }
        });
    </script>

</body>
</html>
