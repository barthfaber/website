<!-- JavaScript -->
    <script>
        var youtubeVideoId = "vEOqapYtBpo"; 

        function openShowreel() {
            var modal = document.getElementById("videoModal");
            var iframe = document.getElementById("fullVideo");
            var bgVideo = document.getElementById("bgVideo");
            
            // Pauzeer de achtergrondvideo om systeembronnen te besparen en stotteren te voorkomen
            if (bgVideo) {
                bgVideo.pause();
            }

            iframe.src = "https://www.youtube.com/embed/" + youtubeVideoId + "?autoplay=1&rel=0&enablejsapi=1";
            modal.style.display = "flex";
        }

        function closeShowreel() {
            var modal = document.getElementById("videoModal");
            var iframe = document.getElementById("fullVideo");
            var bgVideo = document.getElementById("bgVideo");
            
            // Laat de achtergrondvideo weer verder spelen zodra de modal sluit
            if (bgVideo) {
                bgVideo.play();
            }

            iframe.src = "";
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            var modal = document.getElementById("videoModal");
            if (event.target == modal) {
                closeShowreel();
            }
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            var dropdown = document.getElementById('dropdownToggle');
            dropdown.classList.toggle('open');
        }

        document.addEventListener('click', function() {
            var dropdown = document.getElementById('dropdownToggle');
            if (dropdown) {
                dropdown.classList.remove('open');
            }
        });

        function isMobile() {
            return window.innerWidth <= 1000;
        }

        var fadeTimer;

        function startFadeTimer(duration) {
            clearTimeout(fadeTimer);
            fadeTimer = setTimeout(function() {
                var photoFrame = document.getElementById("photoFrame");
                if (photoFrame) {
                    photoFrame.classList.add("faded");
                }
            }, duration);
        }

        // Bij laden: 2.5 seconden zichtbaar
        startFadeTimer(2500);

        function handleUserActivity() {
            if (isMobile()) {
                var photoFrame = document.getElementById("photoFrame");
                if (photoFrame) {
                    photoFrame.classList.remove("faded");
                    startFadeTimer(1500);
                }
            }
        }

        window.addEventListener('scroll', handleUserActivity);
        window.addEventListener('touchstart', handleUserActivity);

        // EXTRA: Blokkeer de rechtermuisknop op het fotokader
        document.getElementById('photoFrame').addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
