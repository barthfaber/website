<!-- JavaScript voor de YouTube Pop-up, Klik-menu en Timed Fade-out bij Scroll/Touch -->
    <script>
        var youtubeVideoId = "BR2MBug7Xc8"; 

        function openShowreel() {
            var modal = document.getElementById("videoModal");
            var iframe = document.getElementById("fullVideo");
            
            iframe.src = "https://www.youtube.com/embed/" + youtubeVideoId + "?autoplay=1&rel=0&enablejsapi=1";
            modal.style.display = "flex";
        }

        function closeShowreel() {
            var modal = document.getElementById("videoModal");
            var iframe = document.getElementById("fullVideo");
            
            iframe.src = "";
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            var modal = document.getElementById("videoModal");
            if (event.target == modal) {
                closeShowreel();
            }
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            var dropdown = document.getElementById('dropdownToggle');
            dropdown.classList.toggle('open');
        }

        document.addEventListener('click', function() {
            var dropdown = document.getElementById('dropdownToggle');
            if (dropdown) {
                dropdown.classList.remove('open');
            }
        });

        function isMobile() {
            return window.innerWidth <= 1000;
        }

        // Variabele om de timer te onthouden zodat we hem kunnen resetten
        var fadeTimer;

        function startFadeTimer() {
            // Wis een eventuele lopende timer zodat ze elkaar niet in de wielen rijden
            clearTimeout(fadeTimer);
            
            // Start een nieuwe timer van 3 seconden
            fadeTimer = setTimeout(function() {
                var photoFrame = document.getElementById("photoFrame");
                if (photoFrame) {
                    photoFrame.classList.add("faded");
                }
            }, 3000);
        }

        // 1. Bij het laden van de pagina start de eerste timer van 3 seconden
        startFadeTimer();

        // 2. Zodra de mobiele gebruiker scrollt of het scherm aanraakt
        function handleUserActivity() {
            if (isMobile()) {
                var photoFrame = document.getElementById("photoFrame");
                if (photoFrame) {
                    // Laat de foto direct zien
                    photoFrame.classList.remove("faded");
                    
                    // Start de 3-seconden timer opnieuw (zodat hij weer verdwijnt als je stopt met scrollen)
                    startFadeTimer();
                }
            }
        }

        window.addEventListener('scroll', handleUserActivity);
        window.addEventListener('touchstart', handleUserActivity);
    </script>
