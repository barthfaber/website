        /* Specifieke stijlen voor de Showreel-pagina */
        .page-section {
            flex: 1;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 40px 120px;

        }

            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 900px) {
            .page-section {
                padding-left: 20px;
                padding-right: 20px;
            }

            .page-title {
                font-size: 2rem;
                margin-bottom: 25px;
